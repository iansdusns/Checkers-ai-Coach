kind = "web"
previewPath = "/"
title = "Checkers"
version = "1.0.0"
id = "artifacts/checkers"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26127

[services.development]
run = "pnpm --filter @workspace/checkers run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/checkers", "run", "build" ]
publicDir = "artifacts/checkers/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26127"
BASE_PATH = "/"
